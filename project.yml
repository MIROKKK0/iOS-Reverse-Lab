name: iOSReverseLab
options:
  bundleIdPrefix: app.iosreverselab
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
targets:
  iOSReverseLab:
    type: application
    platform: iOS
    sources:
      - path: iOSReverseLab
    info:
      path: iOSReverseLab/Info.plist
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.iosreverselab.mobile
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
  iOSReverseLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iOSReverseLabTests
    dependencies:
      - target: iOSReverseLab
